name: Preview Site Wrapper

# Controls when the action will run. 
on:
  # Triggers the workflow on pull request events but only for the master branch
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, edited, reopened]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build-for-netlify"
  triger-previewing-site:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4 # persist-credentials: false is required below for the deployment to work correctly.
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Build Docs
        run: docsforge build
      - name: Zip Site
        run: |
          rm -f site.zip
          zip -r site.zip ./site
      - uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: ./site.zip
      - name: Triger Inner workflow
        run: echo "triger inner workflow"